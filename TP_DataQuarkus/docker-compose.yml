services:
  # ---- Apache Kafka (KRaft, sans ZooKeeper) ----
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      # Configuration KRaft (équivalents de server.properties)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # Réglages pratiques pour un cluster 1 nœud en DEV
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    networks:
      - appnet

  # ---- Micro-services Quarkus ----
  delivery-service:
    image: plb/delivery-service:1.0.0
    container_name: delivery-service
    environment:
      - MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8083:8083"
    restart: unless-stopped
    networks:
      - appnet

  product-service:
    image: plb/product-service:1.0.0
    container_name: product-service
    environment:
      - MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8082:8080"
    restart: unless-stopped
    networks:
      - appnet

  order-service:
    image: plb/order-service:1.0.0
    container_name: order-service
    environment:
      - MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - appnet

  payment-service:
    image: plb/payment-service:1.0.0
    container_name: payment-service
    environment:
      - MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    restart: unless-stopped
    networks:
      - appnet
volumes:
  kafka-data:

networks:
  appnet:
    driver: bridge
