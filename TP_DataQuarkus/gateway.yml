# ---------- Gateway ----------
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: app-gw
  namespace: default
spec:
  gatewayClassName: nginx          # <-- adapte selon le contrôleur que tu installes
  listeners:
    - name: http
      protocol: HTTP
      port: 80

---
# ---------- /orders (POST)  -> order-svc  (Rewrite: /orders -> /api/orders) ----------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-order
  namespace: default
spec:
  parentRefs:
    - name: app-gw
  rules:
    - matches:
        - path:
            type: PathExact
            value: /orders
          method: POST
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /api/orders
      backendRefs:
        - name: order-service
          port: 80

---
# ---------- /tickets/** -> product-svc (Rewrite prefix: /tickets -> /api/tickets) ----------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-product
  namespace: default
spec:
  parentRefs:
    - name: app-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /tickets
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch     # /tickets/foo -> /api/tickets/foo
              replacePrefixMatch: /api/tickets
      backendRefs:
        - name: product-service
          port: 80

---
# ---------- /livraisons, /livraisons/** -> delivery-svc (Rewrite prefix: /livraisons -> /api/livraisons) ----------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-livraison
  namespace: default
spec:
  parentRefs:
    - name: app-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /livraisons          # couvre /livraisons et /livraisons/**
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch   # /livraisons -> /api/livraisons (+ suffixe éventuel)
              replacePrefixMatch: /api/livraisons
      backendRefs:
        - name: delivery-service
          port: 80
